##
## freshclam.conf - Bundled with Risknox Pulse
## freshclam is launched by update_definitions.bat with an explicit
## --datadir pointing at %ProgramData%\Risknox Pulse\antivirus\database.
## Keep this file free of an install-path-specific DatabaseDirectory so the
## scanner and updater use the same writable database location.
##

# Mirror to download updates from
DatabaseMirror database.clamav.net

# Log file for update operations
UpdateLogFile freshclam.log
LogRotate yes

# How many times per day to check for updates (every 2 hours)
Checks 12

# Don't report to ClamAV stats servers
SubmitDetectionStats no
