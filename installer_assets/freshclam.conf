##
## freshclam.conf - Bundled with Risknox Pulse
## Paths are relative to the agent install directory so this works
## on any machine regardless of where the app is installed.
##

# Mirror to download updates from
DatabaseMirror database.clamav.net

# Where to store virus databases (relative to the executable CWD)
# When run via schtasks, the CWD is set to {app} by the scheduler entry.
DatabaseDirectory clamav\database

# Log file for update operations
UpdateLogFile clamav\freshclam.log
LogRotate yes

# How many times per day to check for updates (every 2 hours)
Checks 12

# Don't report to ClamAV stats servers
SubmitDetectionStats no
