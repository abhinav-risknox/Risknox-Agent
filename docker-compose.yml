
services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms2048m -Xmx2048m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Opensearch@123
      - plugins.security.disabled=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - risknox-net

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    ports:
      - 5170:5170
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit-scripts:/fluent-bit/scripts:ro
    networks:
      - risknox-net
    depends_on:
      - opensearch
      - data-prepper

  data-prepper:
    image: opensearchproject/data-prepper:latest
    container_name: data-prepper
    ports:
      - 2021:2021
    environment:
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Opensearch@123
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
      - ./data-prepper/windows-xml-parser/build/libs/windows-xml-parser-1.0-SNAPSHOT.jar:/usr/share/data-prepper/lib/windows-xml-parser-1.0-SNAPSHOT.jar:ro   
    networks:
      - risknox-net
    depends_on:
      - opensearch

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - 5601:5601
    depends_on:
      - opensearch
    networks:
      - risknox-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=risknox
    ports:
      - 5433:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - risknox-net

  manager:
    build:
      context: .
      dockerfile: manager/Dockerfile
    container_name: resolutepulse-manager
    environment:
      - RPLS_DB_CONN=host=postgres port=5432 dbname=risknox user=postgres password=postgres
      - RPLS_PORT=1514
    ports:
      - 1514:1514
      - 8080:8080
    volumes:
      - manager-ca-data:/app/ca
    networks:
      - risknox-net
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build: ./manager/dashboard
    container_name: resolutepulse-dashboard
    ports:
      - 80:80
    networks:
      - risknox-net
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped

  sigma-loader:
    build:
      context: ./sigma-loader
    container_name: sigma-loader
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - INDEX_NAME=rp-events
      - DETECTOR_NAME=Windows-Threat-Detector
    networks:
      - risknox-net
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://opensearch:9200/rp-events"]
      interval: 10s
      timeout: 5s
      retries: 60

networks:
  risknox-net:

volumes:
  postgres-data:
  manager-ca-data:
  opensearch-data:
