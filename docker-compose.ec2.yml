version: '3'
services:
  opensearch:
    image: opensearchproject/opensearch:latest
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Opensearch@123
      - plugins.security.disabled=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - risknox-net

  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: fluent-bit
    ports:
      - 5170:5170
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit-scripts:/fluent-bit/scripts:ro
    networks:
      - risknox-net
    depends_on:
      - opensearch
      - data-prepper

  data-prepper:
    image: opensearchproject/data-prepper:latest
    container_name: data-prepper
    ports:
      - 2021:2021
    environment:
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Opensearch@123
    volumes:
      - ./data-prepper/pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml:ro
      - ./data-prepper/data-prepper-config.yaml:/usr/share/data-prepper/config/data-prepper-config.yaml:ro
      - ./data-prepper/windows-event-normalizer/build/libs/windows-event-normalizer-1.0-SNAPSHOT.jar:/usr/share/data-prepper/lib/windows-event-normalizer-1.0-SNAPSHOT.jar:ro
    networks:
      - risknox-net
    depends_on:
      - opensearch

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - 5601:5601
    depends_on:
      - opensearch
    networks:
      - risknox-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=risknox
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/001_certificates.sql:/docker-entrypoint-initdb.d/001_certificates.sql:ro
    networks:
      - risknox-net

  manager:
    # ── Pulled directly from Docker Hub by GitHub Actions on every push to main
    image: abhinavrisknox/risknox-manager:latest
    pull_policy: always
    container_name: resolutepulse-manager
    environment:
      - RPLS_DB_CONN=host=postgres port=5432 dbname=risknox user=postgres password=postgres
      - RPLS_PORT=1514
    ports:
      - 1514:1514
      - 8080:8080
      - 1515:1515
    volumes:
      - manager-ca-data:/app/ca
    networks:
      - risknox-net
    depends_on:
      - postgres
    restart: unless-stopped

  dashboard:
    image: abhinavrisknox/risknox-dashboard:latest
    pull_policy: always
    container_name: resolutepulse-dashboard
    ports:
      - 80:80
    networks:
      - risknox-net
    depends_on:
      - manager
    restart: unless-stopped

  # ── Watchtower: polls Docker Hub every 5 min, auto-restarts manager on new image
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker Hub credentials so watchtower can pull private images
      - /root/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=false
    # Watch both manager and dashboard
    command: resolutepulse-manager resolutepulse-dashboard
    networks:
      - risknox-net
    restart: unless-stopped

networks:
  risknox-net:

volumes:
  postgres-data:
  manager-ca-data:
  opensearch-data:
