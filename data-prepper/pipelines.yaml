# Pipeline that separates FIM events into their own index
windows-events-pipeline:
  source:
    http:
      port: 2021
      path: "/log/ingest"
      authentication:
        unauthenticated:

  route:
    - fim_route: '/channel == "fim" or /channel == "FIM"'
    - other_route: '/channel != "fim" and /channel != "FIM"'

  sink:
    # FIM Events go to their own index
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        username: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
        index: "windows-events-fim"
        routes:
          - fim_route

    # All other Windows Events go to the standard index
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        username: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
        index: "windows-events"
        routes:
          - other_route
