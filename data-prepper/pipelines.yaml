# Pipeline: Parse Windows Event XML via custom processor plugin
# Fields are written flat at document root matching OSSA raw_field names
# (CommandLine, EventID, SubjectUserName, etc.) for 100% auto-mapping.
#
# ARCHITECTURE:
#   Agent → TCP (compact NDJSON) → Fluent Bit (rename keys) → Data Prepper (this) → OpenSearch
#   The 'data' field contains raw Windows Event XML when source_type=winevent
#
# OUTPUT STRUCTURE (flat at root):
#   EventID, Provider_Name, Channel, ComputerName  — from <System> block
#   CommandLine, Image, SubjectUserName, ...        — from <EventData> block
#   @timestamp                                      — from TimeCreated_SystemTime


rp-events-pipeline:
  source:
    http:
      port: 2021
      path: "/log/ingest"
      authentication:
        unauthenticated:

  processor:
    # ─── Parse Windows Event XML → flat raw_field output ────────────────
    - windows_xml_parser:
        source_field: "data"
        drop_raw_xml: true

  route:
    - fim_route: '/channel == "fim" or /channel == "FIM"'
    - other_route: '/channel != "fim" and /channel != "FIM"'

  sink:
    # FIM Events → dedicated index
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        username: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
        index: "rp-events-fim"
        index_type: "management_disabled"
        routes:
          - fim_route

    # All other Windows Events → standard index
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        username: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
        index: "rp-events"
        index_type: "management_disabled"
        routes:
          - other_route
