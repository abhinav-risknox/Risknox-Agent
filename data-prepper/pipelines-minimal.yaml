# Minimal fallback - zero processing, just forward everything to OpenSearch
windows-events-pipeline:
  source:
    http:
      port: 2021
      path: "/log/ingest"
      authentication:
        unauthenticated:

  sink:
    - opensearch:
        hosts: [ "http://opensearch:9200" ]
        insecure: true
        username: "${OPENSEARCH_USERNAME}"
        password: "${OPENSEARCH_PASSWORD}"
        index: "windows-events"
