name: Build & Deploy Manager

on:
  push:
    branches: [main]
    paths:
      - 'src/manager/**'
      - 'src/utils/**'
      - 'src/common/**'
      - 'manager/Dockerfile'
      - 'manager/CMakeLists.txt'
      - 'db/migrations/**'
      - '.github/workflows/deploy-manager.yml'
  workflow_dispatch:   # allow manual trigger from GitHub UI

env:
  IMAGE_NAME: abhinavrisknox/risknox-manager

jobs:
  build-and-deploy:
    name: Build image & deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Docker Buildx (faster multi-platform builds, better caching) ──────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to Docker Hub ───────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Build & push image ────────────────────────────────────────────────
      - name: Build and push Manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: manager/Dockerfile
          push: true
          # Two tags: rolling 'latest' + immutable SHA tag for rollback
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Layer cache from previous builds (dramatically speeds up rebuilds)
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:cache
          cache-to:   type=registry,ref=${{ env.IMAGE_NAME }}:cache,mode=max

      # ── 5. SSH into EC2 and pull + restart ───────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/manager
            docker compose pull manager
            docker compose up -d manager
            docker image prune -f
            echo "Deploy complete: ${{ github.sha }}"

      # ── 6. Notify result ─────────────────────────────────────────────────────
      - name: Report deployment SHA
        if: success()
        run: |
          echo "Manager deployed: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
