[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

# INPUT: TCP socket receiver (Binary protocol)
[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          5170
    Tag           agent-events
    Format        none         # Raw binary data
    Chunk_Size    32
    Buffer_Size   64

# FILTER: Parse binary protocol (length + agent ID + XML)
[FILTER]
    Name    lua
    Match   agent-events
    script  /fluent-bit/etc/parse_binary.lua
    call    parse_binary_message

# FILTER: Parse Windows Event XML into structured fields
[FILTER]
    Name    lua
    Match   agent-events
    script  /fluent-bit/etc/parse_windows_xml.lua
    call    parse_windows_event_xml

# OUTPUT: Send to OpenSearch
[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Index           windows-logs
    Suppress_Type_Name On
    Retry_Limit     5
    Trace_Output    On
    Trace_Error     On
