# Fluent Bit Configuration - Windows Event Log to ECS Format
# Maps all fields to Elastic Common Schema (ECS) for Sigma rule compatibility

[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info

# INPUT: TCP listener for agent events
[INPUT]
    Name              tcp
    Listen            0.0.0.0
    Port              5170
    Format            json
    Chunk_Size        32
    Buffer_Size       64
    Tag               windows.events

# FILTER: Rename compact field names to full names
[FILTER]
    Name         modify
    Match        windows.events
    Rename       c channel
    Rename       e event_id
    Rename       t timestamp
    Rename       x data
    Rename       s source_type

# FILTER: The Lua filter was removed. Data Prepper natively parses XML now.

# FILTER: Add agent metadata
[FILTER]
    Name         record_modifier
    Match        windows.events
    Record       agent.type windows-agent
    Record       agent.version 1.0.0

# OUTPUT: Forward to Data Prepper
[OUTPUT]
    Name            http
    Match           windows.events
    Host            data-prepper
    Port            2021
    URI             /log/ingest
    Format          json
    Retry_Limit     5
