# Fluent Bit Configuration - Windows Event Log to ECS Format
# Maps all fields to Elastic Common Schema (ECS) for Sigma rule compatibility

[SERVICE]
    Flush        5
    Daemon       off
    Log_Level    info

# INPUT: TCP listener for agent events
[INPUT]
    Name              tcp
    Listen            0.0.0.0
    Port              5170
    Format            json
    Chunk_Size        32
    Buffer_Size       64
    Tag               windows.events

# FILTER: Rename compact field names to full names
[FILTER]
    Name         modify
    Match        windows.events
    Rename       c channel
    Rename       e event_id
    Rename       t timestamp
    Rename       x data

# FILTER: Parse XML to extract all fields in ECS format
[FILTER]
    Name    lua
    Match   windows.events
    script  /fluent-bit/scripts/parse_windows_xml.lua
    call    parse_event_xml

# FILTER: Add agent metadata
[FILTER]
    Name         record_modifier
    Match        windows.events
    Record       agent.type windows-agent
    Record       agent.version 1.0.0

# OUTPUT: Forward to OpenSearch
[OUTPUT]
    Name            opensearch
    Match           windows.events
    Host            opensearch
    Port            9200
    Index           windows-events
    Type            _doc
    HTTP_User       admin
    HTTP_Passwd     Opensearch@123
    tls             Off
    Trace_Error     On
    Retry_Limit     5
    Suppress_Type_Name On
